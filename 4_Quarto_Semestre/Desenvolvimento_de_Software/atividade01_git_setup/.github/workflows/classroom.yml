name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Teste Atividade 01
      id: teste-atividade-01
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Teste Atividade 01
        setup-command: ''
        command: python3 setup_check.py
        timeout: 5
        max-score: 11
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TESTE-ATIVIDADE-01_RESULTS: "${{steps.teste-atividade-01.outputs.result}}"
      with:
        runners: teste-atividade-01
